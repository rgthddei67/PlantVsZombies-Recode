plugins { id 'com.android.application' }

android {
    namespace 'org.pvz.recode'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.pvz.recode'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1-android-preview'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        assets.srcDirs = ['../../build/android-package/assets']
        jniLibs.srcDirs = ['../../build/android-package/jniLibs']
        java.srcDirs += ['../../build/android-package/sdl-java']
    }
    androidResources { noCompress += ['mo3', 'ogg', 'png', 'jpg', 'ttf', 'reanim', 'xml'] }
    signingConfigs.debug {
        storeFile file(providers.gradleProperty('pvzDebugKeystore').getOrElse('D:/Android/debug.keystore'))
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }
}
